name: SEO Agent — Radar en tiempo real

# EL RELOJ PRINCIPAL YA NO VIVE AQUÍ (2026-08-24).
#
# El `schedule` de GitHub Actions es best-effort y se desprioriza: pedía */10 y
# entregaba 27 min de mediana, **con el 7% de los huecos por encima de una hora**
# (peor caso medido: 1h51 en pleno día, sobre 242 intervalos de 7 días). Un
# `workflow_dispatch`, en cambio, arranca en 9 segundos.
#
# Ahora dispara un cron externo (cron-job.org) cada 15 min contra
# `/api/run-agent` del dashboard, que hace el dispatch con el token guardado del
# lado servidor. Ese endpoint defiende además la pausa de madrugada, para que un
# cron mal configurado no despierte al agente a las 3 a.m.
#
# ESTOS CRON SE QUEDAN COMO RED DE SEGURIDAD, cada 2 horas: si el servicio
# externo se cae o alguien borra el job, el agente sigue corriendo con la
# cadencia vieja en vez de apagarse en silencio. Cuestan ~10 corridas/día
# (~$0,10/día) y evitan un punto único de fallo en un tercero gratuito.
on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'   # UTC = 05,07,09,11,13,15,17 Lima
    - cron: '0 0,2,4 * * *'                  # UTC = 19,21,23 Lima
  workflow_dispatch:

concurrency:
  group: seo-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run realtime radar
        env:
          MARFEEL_EMAIL:    ${{ secrets.MARFEEL_EMAIL }}
          MARFEEL_PASSWORD: ${{ secrets.MARFEEL_PASSWORD }}
          SERPAPI_KEY:      ${{ secrets.SERPAPI_KEY }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ secrets.AWS_REGION }}
          BEDROCK_MODEL_ID:      ${{ secrets.BEDROCK_MODEL_ID }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:          ${{ secrets.OPENAI_MODEL }}
          OPENROUTER_API_KEY:    ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL:      ${{ secrets.OPENROUTER_MODEL }}
          LLM_PROVIDER:          ${{ vars.LLM_PROVIDER }}
          TZ: America/Lima
        run: |
          cd agent
          python run_radar.py
